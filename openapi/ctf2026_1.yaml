openapi: 3.2.0
info:
  version: 1.0.1
  title: CTF2026 API
  description: API for Capture the Flag 2026
servers:
  - url: https://mainframeyin:8092/CTF2026/API/v1
paths:
  /loginInfo:
    summary: Get login information for current user
    get:
      summary: Get login information for current user
      tags:
        - retrieve
      responses:
        '200':
          description: Successful retrieval of login information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/loginInfo"
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '500':
          description: Internal server error
        default:
          description: Unexpected error
      x-LWWProcessingSteps:
        $ref: "ctf2026_2.yaml/paths/~1loginInfo/get/x-LWWProcessingSteps"
  /detectives:
    summary: Manage detectives
    post:
      summary: Add new detective
      tags:
        - create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectivesRequestPost"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectivesCRUDLong"
        '401':
          description: Unauthorized
        '404':
          $ref: "#/components/schemas/DetectivesCRUDShort"
          description: Not found
        '500':
          $ref: "#/components/schemas/DetectivesCRUDShort"
          description: Internal server error
        default:
          description: Unexpected error
      x-LWWProcessingSteps:
        $ref: "ctf2026_2.yaml/paths/~1detectives/post/x-LWWProcessingSteps"
  /hints:
    summary: Retrieve hints
    get:
      summary: Retrieve hints
      tags:
        - retrieve
      parameters:
        - name: hintCode
          in: query
          description: Hint to retrieve
          required: true
          schema:
            $ref: "#/components/schemas/hintCode"
      responses:
        '200':
          description: Successful retrieval of a hint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HintsResponse"
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '500':
          description: Internal server error
        default:
          description: Unexpected error
      x-LWWProcessingSteps:
        $ref: "ctf2026_2.yaml/paths/~1hints/get/x-LWWProcessingSteps"
  /sqlquery:
    summary: Execute an SQL query
    post:
      summary: Execute an SQL query
      tags:
        - execute
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SQLQueryRequestPost"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SQLQueryResponse"
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '500':
          description: Internal server error
        default:
          description: Unexpected error
      x-LWWProcessingSteps:
        $ref: "ctf2026_2.yaml/paths/~1sqlquery/post/x-LWWProcessingSteps"
  /tsqueues:
    summary: Retrieve TS queue
    get:
      summary: Retrieve TS queue
      tags:
        - retrieve
      parameters:
        - name: tsqName
          in: query
          description: TS queue name to retrieve
          required: true
          schema:
            $ref: "#/components/schemas/tsqName"
      responses:
        '200':
          description: Successful retrieval of a TS queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TsqueuesResponse"
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '500':
          description: Internal server error
        default:
          description: Unexpected error
      x-LWWProcessingSteps:
        $ref: "ctf2026_2.yaml/paths/~1tsqueues/get/x-LWWProcessingSteps"
  /token:
    summary: Retrieve access token
    post:
      summary: Retrieve access token
      operationId: newAccessToken
      tags:
        - create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequestPost"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
        default:
          description: Unexpected error
      x-LWWProcessingSteps:
        $ref: "ctf2026_2.yaml/paths/~1token/post/x-LWWProcessingSteps"
components:
  schemas:
    loginInfo:
      type: object
      properties:
        userid:
          $ref: "#/components/schemas/userid"
        nickname:
          $ref: "#/components/schemas/nickname"
        fragmentsResolved:
          type: array
          items:
            type: object
            properties:
              fragment:
                $ref: "#/components/schemas/fragment"
              positiveOrNegative:
                $ref: "#/components/schemas/positiveOrNegative"
              points:
                $ref: "#/components/schemas/points"
    DetectivesRequestPost:
      type: object
      properties:
        userid:
          $ref: "#/components/schemas/userid"
        nickname:
          $ref: "#/components/schemas/nickname"
        email:
          $ref: "#/components/schemas/email"
    DetectivesCRUDLong:
      type: object
      properties:
        returnCode:
          $ref: "#/components/schemas/returnCode"
        reasonCode:
          $ref: "#/components/schemas/reasonCode"
        infoMessage:
          $ref: "#/components/schemas/infoMessage"
        userid:
          $ref: "#/components/schemas/userid"
        nickname:
          $ref: "#/components/schemas/nickname"
        email:
          $ref: "#/components/schemas/email"
        createdBy:
          $ref: "#/components/schemas/userid"
        createdDate:
          $ref: "#/components/schemas/date"
        updatedBy:
          $ref: "#/components/schemas/userid"
        updatedDate:
          $ref: "#/components/schemas/date"
    DetectivesCRUDShort:
      type: object
      properties:
        returnCode:
          $ref: "#/components/schemas/returnCode"
        reasonCode:
          $ref: "#/components/schemas/reasonCode"
        infoMessage:
          $ref: "#/components/schemas/infoMessage"
    HintsResponse:
      type: object
      properties:
        hintText:
          $ref: "#/components/schemas/hintText"
    SQLQueryRequestPost:
      type: object
      properties:
        sqlquery:
          type: string
          minLength: 1
          maxLength: 256
          example: SELECT ACCTIME, INOROUT, USERID FROM CTF2026.ACCLOG ORDER BY ACCTIME DESC
    SQLQueryResponse:
      type: object
      properties:
        sqlcode:
          type: number
        sqlResults:
          type: array
          items:
            type: object
            properties:
              resultLine:
                type: string
                minLength: 0
                maxLength: 80
    TsqueuesResponse:
      type: object
      properties:
        tsqContent:
          $ref: "#/components/schemas/tsqContent"
    TokenRequestPost:
      type: object
      properties:
        username:
          $ref: "#/components/schemas/userid"
        password:
          $ref: "#/components/schemas/password"
    TokenResponse:
      type: object
      properties:
        token:
          $ref: "#/components/schemas/token"
    #
    # Dictionary part
    userid:
      type: string
      minLength: 1
      maxLength: 8
      example: CTF001
    password:
      type: string
      minLength: 1
      maxLength: 100
    token:
      type: string
      minLength: 1
      maxLength: 1024
    nickname:
      type: string
      minLength: 1
      maxLength: 128
      example: Ief Br14
    email:
      type: string
      minLength: 1
      maxLength: 128
      example: someone@somecompany.com
    fragment:
      type: string
      minLength: 1
      maxLength: 8
      example: INTRO
    positiveOrNegative:
      type: string
      minLength: 1
      maxLength: 1
      example: P
    points:
      type: integer
      example: 10
    returnCode:
      type: string
      minLength: 2
      maxLength: 2
      example: "00"
    reasonCode:
      type: string
      minLength: 2
      maxLength: 2
      example: "04"
    infoMessage:
      type: string
      minLength: 0
      maxLength: 72
      example: "entry not found"
    date:
      type: string
      minLength: 26
      maxLength: 26
      example: 2026-01-01 12:00:00.000000
    hintCode:
      type: string
      minLength: 1
      maxLength: 8
      example: INTRO
    hintText:
      type: string
      minLength: 1
      maxLength: 256
      example: sample hint text
    tsqName:
      type: string
      minLength: 1
      maxLength: 16
      example: LETMYLEGOGO
    tsqContent:
      type: string
      minLength: 1
      maxLength: 255